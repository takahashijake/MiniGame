name: Tagged build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DMINIGAME_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Install
        run: cmake --install build --config Release --prefix dist
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: minigame-${{ runner.os }}-${{ github.ref_name }}
          path: dist/
