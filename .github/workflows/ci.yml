name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: native-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DMINIGAME_BUILD_TESTS=ON -DMINIGAME_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizers
        run: cmake -S . -B build-sanitize -DMINIGAME_BUILD_TESTS=ON -DMINIGAME_WARNINGS_AS_ERRORS=ON -DMINIGAME_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-sanitize
      - name: Test
        run: ctest --test-dir build-sanitize --output-on-failure

  webassembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
      - name: Check frontend JavaScript
        run: node --check web/app.js
      - name: Configure WebAssembly build
        run: emcmake cmake -S . -B build-web -DMINIGAME_BUILD_TESTS=OFF -DMINIGAME_WARNINGS_AS_ERRORS=ON
      - name: Build browser product
        run: cmake --build build-web --target minigame_web
      - name: Verify web bundle
        shell: bash
        run: |
          test -f build-web/web-dist/index.html
          test -f build-web/web-dist/styles.css
          test -f build-web/web-dist/app.js
          test -f build-web/web-dist/minigame.js
          test -f build-web/web-dist/minigame.wasm
      - name: Upload web preview
        uses: actions/upload-artifact@v4
        with:
          name: minigame-web-preview
          path: build-web/web-dist/
